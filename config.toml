[server]
host = "0.0.0.0"
port = 4517

[llm]
provider = "9router"
model = "ag/gemini-3.8-flash-high"
effort = "high"
efforts = ["low", "high", "max"]
request_timeout = 180
temperature = 0.3 # ignored while thinking mode is on

[llm.providers.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
thinking = true

[llm.providers."9router"]
base_url = "http://70.153.137.203/v1"
api_key_env = "ROUTER9_API_KEY"
thinking = false

[storage]
data_dir = "data"

[skills]
dirs = ["skills"]

[agent]
instructions = ["AGENTS.md", "prompts/operator_policy.md", "prompts/supervisor_policy.md"]
seed_history = "prompts/seed_history.json"

[uploads]
max_bytes = 10485760
max_files_per_field = 5
file_char_cap = 50000
total_char_cap = 120000

[tools]
max_steps = -1 # -1 means no cap
bash_timeout = 120
bash_output_bytes = 10485760
output_chars = 20000
read_max_lines = 2000
http_timeout = 30

[supervisor]
# pause before retrying a chain that errored or came back empty (doubles up
# to 120s); successful chains roll straight into the next chain
error_backoff_seconds = 30
