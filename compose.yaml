services:
  l4rpness:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      args:
        TOOLSET: ${L4RP_TOOLSET:-custom}
    image: l4rpness:local
    ports:
      - "127.0.0.1:4517:4517"
    # root inside the container (runtime package installs, raw-socket tools),
    # pinned here so image defaults cannot silently change it
    user: "0:0"
    # chromium (the playwright browser) wants more than docker's default
    # 64 MB /dev/shm; heavier pages crash without this
    shm_size: "1gb"
    # escape hardening: the container never gains privileges, cannot mount or
    # load modules (no SYS_ADMIN/SYS_MODULE) and keeps only the capabilities a
    # pentest toolbox needs. The docker socket is never mounted.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_CHROOT
      - SYS_PTRACE
    env_file:
      - path: .env
        required: false
    volumes:
      - l4rpness-data:/app/data
      # Kernel-pentest VM control socket. Only this directory is mounted, and
      # only the socket is ever in it: the guest images, the keyfiles and the
      # serial consoles stay on the host. vm/vmctl.py must be running there for
      # the VM tools to answer.
      - ./vm/run:/app/vm/run      # the Settings UI reads this for change detection and writes runtime
      # knobs through it; add the :ro suffix to make it read-only
      - ./config.toml:/app/config.toml
      # the Settings UI reads this for change detection and rewrites keys
      # through it when the file is writable (touch .env first so compose
      # never mistakes it for a directory). env_file above still injects the
      # values at creation; the mount only adds visibility.
      - ./.env:/app/.env
      - ./skills:/app/skills:ro
      # prompts are instructions, not code: mount them so report-policy edits apply on
      # container recreate without rebuilding the image
      - ./prompts:/app/prompts:ro
      - ./AGENTS.md:/app/AGENTS.md:ro
    restart: unless-stopped

volumes:
  l4rpness-data: