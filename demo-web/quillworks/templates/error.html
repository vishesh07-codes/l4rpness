{% extends "base.html" %}
{% block title %}{{ code }} — Quillworks{% endblock %}
{% block content %}
<div class="error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ message }}</h1>
  <p class="muted">If you followed a link from somewhere else, it may be out of date.</p>
  <a class="btn btn-primary" href="{{ url_for('index') }}">Back to safety</a>
</div>
{% endblock %}
